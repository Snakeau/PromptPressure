[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptpressure"
version = "0.1.0"
description = "Pressure-test your AI before attackers do. Open-core local AI red-teaming scanner."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Snakeau" }]
keywords = ["ai-security", "red-teaming", "prompt-injection", "llm-security", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
]

[project.scripts]
promptpressure = "promptpressure.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["promptpressure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
