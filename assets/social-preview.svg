<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="100%" style="stop-color:#ff7b72"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="100%" style="stop-color:#da3633"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Accent glow (top-left) -->
  <circle cx="200" cy="120" r="300" fill="#f85149" opacity="0.04"/>
  <!-- Accent glow (bottom-right) -->
  <circle cx="1080" cy="520" r="250" fill="#f85149" opacity="0.03"/>

  <!-- Shield icon -->
  <g transform="translate(540, 140)">
    <!-- Shield shape -->
    <path d="M100 0 L200 40 L200 120 C200 180 150 220 100 240 C50 220 0 180 0 120 L0 40 Z"
          fill="url(#shield-fill)" opacity="0.9"/>
    <!-- Exclamation mark inside shield -->
    <rect x="90" y="60" width="20" height="80" rx="4" fill="#0d1117"/>
    <rect x="90" y="160" width="20" height="20" rx="4" fill="#0d1117"/>
  </g>

  <!-- Title -->
  <text x="640" y="440" text-anchor="middle"
        font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="700" fill="#f0f6fc" letter-spacing="-1">
    PromptPressure
  </text>

  <!-- Tagline -->
  <text x="640" y="495" text-anchor="middle"
        font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="400" fill="#8b949e">
    Pressure-test your AI before attackers do
  </text>

  <!-- Bottom tags -->
  <g transform="translate(640, 560)" text-anchor="middle">
    <!-- Tag pills -->
    <g transform="translate(-280, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#f8514920" stroke="#f85149" stroke-width="1"/>
      <text y="5" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#f85149">red-teaming</text>
    </g>
    <g transform="translate(-100, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#f8514920" stroke="#f85149" stroke-width="1"/>
      <text y="5" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#f85149">ai-security</text>
    </g>
    <g transform="translate(100, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#f8514920" stroke="#f85149" stroke-width="1"/>
      <text y="5" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#f85149">prompt-injection</text>
    </g>
    <g transform="translate(280, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#f8514920" stroke="#f85149" stroke-width="1"/>
      <text y="5" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#f85149">llm-security</text>
    </g>
  </g>

  <!-- Top-right terminal snippet (decorative) -->
  <g transform="translate(920, 50)" opacity="0.15">
    <rect width="320" height="120" rx="8" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
    <text x="16" y="30" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">$ promptpressure scan \</text>
    <text x="16" y="50" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">    --mode quick_check \</text>
    <text x="16" y="70" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">    --fail-on high</text>
    <text x="16" y="100" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#f85149">Score: 25/100 [critical_risk]</text>
  </g>

  <!-- Top-left terminal snippet (decorative) -->
  <g transform="translate(40, 50)" opacity="0.15">
    <rect width="280" height="80" rx="8" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
    <text x="16" y="30" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">$ pip install promptpressure</text>
    <text x="16" y="60" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#3fb950">Successfully installed</text>
  </g>
</svg>
